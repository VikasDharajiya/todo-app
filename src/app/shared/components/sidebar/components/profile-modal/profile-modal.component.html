<app-modal title="Workspace Profile" (close)="close.emit()">
  <!-- Form Container -->
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="flex flex-col gap-4.5">
    
    <!-- Avatar Uploader Box -->
    <div class="flex flex-col items-center gap-3">
      <div class="relative group">
        <!-- Avatar Circle -->
        @if (uploadedAvatarUrl()) {
          <img
            [src]="uploadedAvatarUrl()"
            alt="Temp Avatar"
            class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500 shadow-md"
          />
        } @else {
          <div class="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-white font-black text-2xl flex items-center justify-center border-2 border-white dark:border-slate-800 shadow-md">
            {{ currentUserProfile?.username?.[0] || currentUserProfile?.email?.[0] | uppercase }}
          </div>
        }

        <!-- Upload Loader overlay -->
        @if (isUploading()) {
          <div class="absolute inset-0 rounded-full bg-slate-950/70 flex items-center justify-center">
            <app-spinner size="sm" color="text-indigo-500"></app-spinner>
          </div>
        }

        <!-- Hidden file upload triggers clicking custom button below -->
        <input
          #fileInput
          type="file"
          accept="image/*"
          class="hidden"
          (change)="onFileSelected($event)"
        />
      </div>

      <button
        type="button"
        (click)="fileInput.click()"
        class="px-3 py-1.5 text-[10px] font-bold text-indigo-600 dark:text-indigo-300 bg-indigo-50/50 dark:bg-slate-800 border border-indigo-200 dark:border-slate-700 hover:bg-indigo-100/70 dark:hover:bg-slate-700 rounded-lg cursor-pointer transition-all hover:scale-[1.02] active:scale-[0.98]"
      >
        Upload New Photo
      </button>
    </div>

    <!-- Email Address (Read-Only indicator) -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">Email Address</label>
      <input
        type="text"
        [value]="currentUserProfile?.email"
        disabled
        class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs text-slate-500 dark:text-slate-400 select-none cursor-not-allowed focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
      />
    </div>

    <!-- Display Name input -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">Display Username</label>
      <input
        type="text"
        formControlName="username"
        placeholder="Enter username..."
        [class.border-red-500]="profileForm.get('username')?.invalid && profileForm.get('username')?.touched"
        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
      />
      @if (profileForm.get('username')?.invalid && profileForm.get('username')?.touched) {
        <span class="text-[13px] font-semibold text-red-600 dark:text-red-400 mt-1.5 flex items-center gap-1.5 animate-fadeIn">
          <svg class="w-3.5 h-3.5 shrink-0 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          Username is required and must be at least 2 characters.
        </span>
      }
    </div>

    <!-- Form Actions -->
    <div class="flex gap-2.5 pt-3 border-t border-slate-200 dark:border-slate-800">
      <button
        type="button"
        (click)="close.emit()"
        class="flex-1 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-800 rounded-xl transition-all cursor-pointer text-center hover:scale-[1.02] active:scale-[0.98]"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="profileForm.invalid || isUploading()"
        class="flex-1 py-2 text-xs font-bold text-white bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl transition-all shadow-sm cursor-pointer text-center hover:scale-[1.02] active:scale-[0.98]"
      >
        Save Changes
      </button>
    </div>

  </form>
</app-modal>

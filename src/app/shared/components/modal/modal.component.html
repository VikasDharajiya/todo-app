<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop overlay with blur and opacity -->
  <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs transition-opacity" (click)="close.emit()"></div>

  <!-- Modal card -->
  <div 
    class="relative w-full overflow-hidden rounded-3xl bg-white dark:bg-slate-900 shadow-2xl border border-slate-200 dark:border-slate-800 transition-all duration-300"
    [ngClass]="maxWidthClass"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <!-- Header (Optional) -->
    @if (title) {
      <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 dark:border-slate-800">
        <div>
          <h3 class="text-sm font-bold text-slate-900 dark:text-white">
            {{ title }}
          </h3>
          @if (subtitle) {
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400 font-medium">
              {{ subtitle }}
            </p>
          }
        </div>
        <button 
          type="button" 
          (click)="close.emit()" 
          class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 dark:text-slate-500 hover:text-slate-700 rounded-lg cursor-pointer transition-all"
          aria-label="Close modal"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    }

    <!-- Body / Content -->
    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>

<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none pr-4 sm:pr-0">
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto px-4.5 py-3.5 rounded-2xl border flex items-start justify-between gap-3 shadow-[0_15px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.5)] transform translate-y-0 transition-all duration-300 animate-slideIn border-l-4 bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100"
      [class.border-l-emerald-500]="toast.type === 'success'"
      [class.border-l-red-500]="toast.type === 'error'"
      [class.border-l-indigo-500]="toast.type === 'info'"
    >
      <div class="flex items-start gap-3 min-w-0 flex-1">
        <!-- Success Check Icon -->
        @if (toast.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <!-- Error Warn Icon -->
        @if (toast.type === 'error') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        }
        <!-- Info Info Icon -->
        @if (toast.type === 'info') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <span class="text-xs font-bold leading-relaxed break-words whitespace-normal flex-1 pt-0.5">{{ toast.message }}</span>
      </div>

      <!-- Close Button with Cross -->
      <button
        (click)="toastService.remove(toast.id)"
        class="p-1 rounded-lg transition-all cursor-pointer flex items-center justify-center shrink-0 mt-0.5 text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800"
        title="Dismiss notification"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>

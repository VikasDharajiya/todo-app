<div class="fixed top-4 right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none pr-4 sm:pr-0">
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto px-4 py-3 rounded-xl border flex items-center justify-between gap-3 shadow-xl transform translate-y-0 transition-all duration-300 animate-slideIn"
      [class.bg-emerald-50]="toast.type === 'success'"
      [class.dark:bg-emerald-950]="toast.type === 'success'"
      [class.border-emerald-200]="toast.type === 'success'"
      [class.dark:border-emerald-500/40]="toast.type === 'success'"
      [class.text-emerald-900]="toast.type === 'success'"
      [class.dark:text-emerald-200]="toast.type === 'success'"
      
      [class.bg-red-50]="toast.type === 'error'"
      [class.dark:bg-red-950]="toast.type === 'error'"
      [class.border-red-200]="toast.type === 'error'"
      [class.dark:border-red-500/40]="toast.type === 'error'"
      [class.text-red-900]="toast.type === 'error'"
      [class.dark:text-red-200]="toast.type === 'error'"
      
      [class.bg-white]="toast.type === 'info'"
      [class.dark:bg-slate-900]="toast.type === 'info'"
      [class.border-slate-200]="toast.type === 'info'"
      [class.dark:border-slate-800]="toast.type === 'info'"
      [class.text-slate-900]="toast.type === 'info'"
      [class.dark:text-slate-200]="toast.type === 'info'"
    >
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Success Check Icon -->
        @if (toast.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600 dark:text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <!-- Error Warn Icon -->
        @if (toast.type === 'error') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-600 dark:text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        }
        <!-- Info Info Icon -->
        @if (toast.type === 'info') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-500 dark:text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <span class="text-xs font-semibold leading-snug truncate">{{ toast.message }}</span>
      </div>

      <!-- Close Button with Cross -->
      <button
        (click)="toastService.remove(toast.id)"
        class="p-1 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-all cursor-pointer flex items-center justify-center shrink-0"
        title="Dismiss notification"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>

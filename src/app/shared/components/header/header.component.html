<header class="h-16 px-4 sm:px-6 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center shadow-sm shrink-0">
  
  <!-- Mobile / Header Title Left -->
  <div class="flex items-center gap-2.5">
    <!-- Hamburger for Mobile Navigation -->
    <div
      (click)="toggleMobileMenu.emit()"
      class="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700/60 text-slate-700 dark:text-slate-300 rounded-lg md:hidden cursor-pointer transition-all"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </div>
    
    <h1 class="text-xs sm:text-sm font-bold tracking-tight text-slate-900 dark:text-white uppercase tracking-wider">
      @if (router.url.includes('/board')) {
        Workspace Board
      } @else {
        Team Members
      }
    </h1>
  </div>

  <!-- Header Right Actions: Join Code + Theme Toggle -->
  <div class="flex items-center gap-3">
    
    <!-- Copy Join Code Button -->
    @if (organization?.id) {
      <button
        (click)="copyJoinCode(organization.id)"
        class="px-2.5 py-1.5 text-[10px] font-bold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 bg-indigo-50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 rounded-lg border border-indigo-200 dark:border-indigo-500/20 hover:border-indigo-300 dark:hover:border-indigo-500/30 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm"
        title="Copy Join Code for team members to register"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
        </svg>
        <span class="hidden sm:inline">Copy Invite Join Code</span>
        <span class="sm:hidden">Join Code</span>
      </button>
    }

    <!-- Divider -->
    <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>

    <!-- Theme Toggle Switcher -->
    <button
      (click)="toggleTheme.emit()"
      class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800/60 text-slate-600 dark:text-slate-300 transition-all cursor-pointer border border-slate-200 dark:border-slate-800 shadow-sm"
      [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      @if (isDarkMode) {
        <!-- Sun Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
      } @else {
        <!-- Moon Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      }
    </button>

  </div>

</header>

@if (currentUser()) {
  <div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans flex flex-col md:flex-row w-full">
    <!-- Left Sidebar Component -->
    <app-sidebar
      [organization]="organization()"
      [currentUser]="currentUser()"
      [currentUserProfile]="currentUserProfile()"
      [isMobileOpen]="isMobileMenuOpen()"
      (closeMobile)="isMobileMenuOpen.set(false)"
      (profileUpdated)="workspaceService.loadProfileAndWorkspace()"
      (logout)="logout()"
    ></app-sidebar>

    <!-- Main Layout Pane -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
      <!-- Header Component -->
      <app-header
        [organization]="organization()"
        [isDarkMode]="isDarkMode()"
        (toggleTheme)="toggleTheme()"
        (toggleMobileMenu)="isMobileMenuOpen.set(!isMobileMenuOpen())"
        (logout)="logout()"
      ></app-header>

      <!-- Dynamic child route container -->
      <main class="flex-1 overflow-y-auto">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <!-- Loading state overlay if session is resolving -->
  <div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center justify-center gap-4">
    <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-bold text-slate-500 dark:text-slate-400">Loading Workspace...</p>
  </div>
}

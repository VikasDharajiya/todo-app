<div class="flex flex-col gap-3.5 bg-slate-100/50 dark:bg-slate-900/40 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-800/40 min-h-[300px]">
  <div class="flex justify-between items-center px-1">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full" [ngClass]="badgeColorClass"></span>
      <h4 class="text-xs font-extrabold text-slate-700 dark:text-slate-300 uppercase tracking-wider">{{ title }}</h4>
    </div>
    <span class="px-2 py-0.5 text-[10px] font-bold rounded-full" [ngClass]="countColorClass">{{ tasks.length }}</span>
  </div>

  <div class="flex flex-col gap-3 overflow-y-auto max-h-[500px] pr-1.5">
    @for (todo of tasks; track todo.id) {
      <app-task-card
        [todo]="todo"
        [currentUserProfile]="currentUserProfile"
        (updateStatus)="updateStatus.emit($event)"
        (deleteTodo)="deleteTodo.emit($event)"
      ></app-task-card>
    } @empty {
      <div class="p-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col items-center justify-center text-center">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Lane Empty</span>
      </div>
    }
  </div>
</div>

<form [formGroup]="loginForm" (ngSubmit)="handleLogin()" class="flex flex-col gap-4">
  <!-- Email Address -->
  <div class="flex flex-col gap-1.5">
    <label class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">Email Address <span class="text-red-500 font-bold">*</span></label>
    <input
      type="email"
      formControlName="email"
      placeholder="name@company.com"
      [class.border-red-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
      class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
    />
    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
      <span class="text-[13px] font-semibold text-red-600 dark:text-red-400 mt-1.5 flex items-center gap-1.5 animate-fadeIn">
        <svg class="w-3.5 h-3.5 shrink-0 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        Provide a valid email address.
      </span>
    }
  </div>

  <!-- Password -->
  <div class="flex flex-col gap-1.5">
    <div class="flex justify-between items-center">
      <label class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">Password <span class="text-red-500 font-bold">*</span></label>
      <button type="button" (click)="forgotPassword.emit()" class="text-[9px] font-extrabold text-indigo-500 hover:text-indigo-600 transition-colors uppercase tracking-wider cursor-pointer">Forgot Password?</button>
    </div>
    <input
      type="password"
      formControlName="password"
      placeholder="••••••••"
      [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
    />
    @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
      <span class="text-[13px] font-semibold text-red-600 dark:text-red-400 mt-1.5 flex items-center gap-1.5 animate-fadeIn">
        <svg class="w-3.5 h-3.5 shrink-0 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        Password must be at least 6 characters.
      </span>
    }
  </div>

  <button
    type="submit"
    [disabled]="loginForm.invalid || isLoading()"
    class="w-full py-2.5 mt-2 bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white font-semibold rounded-xl transition-all shadow-sm hover:scale-[1.02] active:scale-[0.98] cursor-pointer text-xs disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
  >
    @if (isLoading()) {
      <app-spinner size="sm" color="text-white"></app-spinner>
    }
    <span>{{ isLoading() ? 'Signing in...' : 'Sign In to Workspace' }}</span>
  </button>
</form>
